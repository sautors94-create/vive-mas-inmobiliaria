<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Guerra - SomosViveMás</title>
    <!-- Bootstrap 5 para que se vea bien al probarlo solo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h2>🚀 Tablero de Guerra - Agentes Fundadores</h2>
                <p class="text-secondary">Actualización automática cada 10 segundos</p>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-dark border-secondary text-center p-4">
                    <h1 class="text-success fw-bold mb-0" id="agentCount">0</h1>
                    <small class="text-secondary text-uppercase">Agentes Fundadores</small>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-dark border-secondary text-center p-4">
                    <h1 class="text-primary fw-bold mb-0" id="propCount">0</h1>
                    <small class="text-secondary text-uppercase">Propiedades Activas</small>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-dark border-secondary text-center p-4">
                    <h1 class="text-warning fw-bold mb-0" id="ratio">0</h1>
                    <small class="text-secondary text-uppercase">Props / Agente</small>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card bg-dark border-secondary">
                    <div class="card-header bg-transparent border-secondary">
                        <h5 class="mb-0">Últimos en registrarse</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Ciudad</th>
                                    <th>Rango</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="tbody">
                                <tr>
                                    <td colspan="4" class="text-center text-secondary py-4">Esperando datos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Si lo pruebas en local, usa localhost. Si ya lo subiste, quita el localhost
        const API_URL = '/api/fundadores/stats';

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                document.getElementById('agentCount').innerText = data.totalAgents;
                document.getElementById('propCount').innerText = data.totalProperties;
                document.getElementById('ratio').innerText = data.totalAgents > 0 ? (data.totalProperties / data.totalAgents).toFixed(1) : 0;

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';

                if (data.recentAgents.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary py-4">Aún no hay agentes</td></tr>';
                    return;
                }

                data.recentAgents.forEach(ag => {
                    const tr = document.createElement('tr');
                    const date = new Date(ag.createdAt).toLocaleString('es-MX', { 
                        day: 'numeric', 
                        month: 'short', 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                    tr.innerHTML = `
                        <td>${ag.name}</td>
                        <td>${ag.city}</td>
                        <td><span class="badge bg-secondary">${ag.rank}</span></td>
                        <td class="text-secondary">${date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error conectando al servidor:', error);
            }
        }

        // Ejecutar inmediato y luego cada 10 segundos
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>

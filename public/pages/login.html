<!DOCTYPE html>
<html lang="es">
<head>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('vm_tema')||'{}');if(t&&t.primary){var e=document.createElement('style');e.textContent=':root{--primary:'+t.primary+' !important;--primary-light:'+t.primaryLight+' !important;--accent:'+t.accent+' !important;--accent-dark:'+t.accentDark+' !important;--bg-dark:'+t.bgDark+' !important}';document.head.appendChild(e);}}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Vive Más Inmobiliaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div class="auth-layout">

    <div class="auth-brand">
      <a href="/" class="logo">
        <span class="logo-vive">Vive</span><span class="logo-mas">Más</span>
      </a>
      <h2>Bienvenido de vuelta</h2>
      <p>Accede a tu cuenta para gestionar tus propiedades y favoritos.</p>
      <div class="auth-features">
        <div class="auth-feature">✓ Publica y gestiona tus propiedades</div>
        <div class="auth-feature">✓ Guarda tus propiedades favoritas</div>
        <div class="auth-feature">✓ Contacta directamente a propietarios</div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-box">
        <h1>Iniciar sesión</h1>
        <p class="auth-subtitle">¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a></p>

        <div id="error-msg" class="alert alert-error" style="display:none"></div>

        <form id="login-form">
          <div class="form-grupo">
            <label for="identificador">Correo o teléfono</label>
            <input type="text" id="identificador" class="form-input" placeholder="tu@correo.com o 5512345678" autocomplete="username">
          </div>

<div class="form-grupo">
            <label for="password">Contraseña</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Mostrar contraseña">
                <span class="password-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
                <span class="sr-only">Mostrar contraseña</span>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:16px;margin-top:8px">
            Iniciar sesión
          </button>
        </form>

        <div class="auth-divider">o</div>

        <a href="registro.html" class="btn btn-outline" style="width:100%;padding:14px;font-size:15px;text-align:center">
          Crear cuenta nueva
        </a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (auth.isLoggedIn()) {
      window.location.href = auth.isAdmin() ? 'admin.html' : 'dashboard.html';
    }

    const iniciarSesion = async () => {
      const identificador = document.getElementById('identificador').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';

      if (!identificador || !password) {
        errorMsg.textContent = 'Por favor llena todos los campos';
        errorMsg.style.display = 'block';
        return;
      }

      const btn = document.querySelector('.btn-primary');
      btn.textContent = 'Iniciando sesión...';
      btn.disabled = true;

      // Mostrar mensaje si la sesión expiró (manejado por api.js)
      const expired = localStorage.getItem('vm_session_expired') === '1';
      if (expired) {
        try { localStorage.removeItem('vm_session_expired'); } catch (e) {}
        errorMsg.textContent = 'Tu sesión expiró. Inicia sesión nuevamente.';
        errorMsg.style.display = 'block';
      }

      const payload = identificador.includes('@')
        ? { email: identificador, password }
        : { telefono: identificador, password };

      const data = await api.post('/auth/login', payload);

      if (data.ok) {
        auth.save(data.accessToken, data.user);
        // Redirigir inteligentemente (si venía de guardar un favorito, regresa ahí)
        const redireccion = localStorage.getItem('redireccion_favorito') || (data.user.role === 'admin' ? 'admin.html' : 'dashboard.html');
        localStorage.removeItem('redireccion_favorito');
        window.location.href = redireccion;
      } else if (data.requiereVerificacion) {
        window.location.href = `verificar.html?email=${encodeURIComponent(data.email || identificador)}`;
      } else {
        errorMsg.textContent = data.error || 'Error al iniciar sesión';
        errorMsg.style.display = 'block';
        btn.textContent = 'Iniciar sesión';
        btn.disabled = false;
      }
    };

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      iniciarSesion();
    });
  </script>
<script>window.SOLO_SOPORTE = true;</script>
<script src="../js/chatbot.js"></script>
</body>
</html>

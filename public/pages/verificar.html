<!DOCTYPE html>
<html lang="es">
<head>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('vm_tema')||'{}');if(t&&t.primary){var e=document.createElement('style');e.textContent=':root{--primary:'+t.primary+' !important;--primary-light:'+t.primaryLight+' !important;--accent:'+t.accent+' !important;--accent-dark:'+t.accentDark+' !important;--bg-dark:'+t.bgDark+' !important}';document.head.appendChild(e);}}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar cuenta — Vive Más Inmobiliaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    .verificar-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--primary) 100%);
      padding: 24px;
    }
    .verificar-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .verificar-icon { font-size: 56px; margin-bottom: 16px; }
    .verificar-card h1 { font-size: 28px; margin-bottom: 8px; color: var(--text); }
    .verificar-card p { font-size: 14px; color: var(--text-light); margin-bottom: 32px; line-height: 1.6; }
    .codigo-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .codigo-input {
      width: 52px;
      height: 60px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      font-family: 'Bricolage Grotesque', sans-serif;
      color: var(--primary);
      outline: none;
      transition: all 0.2s;
    }
    .codigo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,71,42,0.1);
    }
    .reenviar-link {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 16px;
    }
    .reenviar-link button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
    }
    .reenviar-link button:disabled {
      color: var(--text-light);
      cursor: not-allowed;
    }
    .timer { font-weight: 600; color: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="verificar-wrap">
    <div class="verificar-card">
      <div class="verificar-icon">📧</div>
      <h1>Verifica tu cuenta</h1>
      <p id="verificar-desc">Ingresa el código de 6 dígitos que enviamos a tu correo electrónico.</p>

      <div id="ver-error" class="alert alert-error" style="display:none;text-align:left"></div>
      <div id="ver-success" class="alert alert-success" style="display:none;text-align:left"></div>

      <div class="codigo-inputs">
        <input type="text" maxlength="1" class="codigo-input" id="c1" oninput="moverFoco(this, 'c2')" onkeydown="retroceder(event, this, null)">
        <input type="text" maxlength="1" class="codigo-input" id="c2" oninput="moverFoco(this, 'c3')" onkeydown="retroceder(event, this, 'c1')">
        <input type="text" maxlength="1" class="codigo-input" id="c3" oninput="moverFoco(this, 'c4')" onkeydown="retroceder(event, this, 'c2')">
        <input type="text" maxlength="1" class="codigo-input" id="c4" oninput="moverFoco(this, 'c5')" onkeydown="retroceder(event, this, 'c3')">
        <input type="text" maxlength="1" class="codigo-input" id="c5" oninput="moverFoco(this, 'c6')" onkeydown="retroceder(event, this, 'c4')">
        <input type="text" maxlength="1" class="codigo-input" id="c6" oninput="moverFoco(this, null)" onkeydown="retroceder(event, this, 'c5')">
      </div>

      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600" onclick="verificar()">
        Verificar cuenta
      </button>

      <div class="reenviar-link">
        ¿No recibiste el código?
        <button id="btn-reenviar" onclick="reenviarCodigo()">Reenviar código</button>
        <span id="timer-wrap" style="display:none">en <span class="timer" id="timer">60</span>s</span>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (!email) window.location.href = 'registro.html';

    document.getElementById('verificar-desc').textContent =
      `Ingresa el código de 6 dígitos que enviamos a ${email}`;

    const moverFoco = (actual, siguienteId) => {
      if (actual.value && siguienteId) {
        document.getElementById(siguienteId).focus();
      }
      if (actual.value && !siguienteId) {
        verificar();
      }
    };

    const retroceder = (e, actual, anteriorId) => {
      if (e.key === 'Backspace' && !actual.value && anteriorId) {
        document.getElementById(anteriorId).focus();
      }
    };

    const getCodigo = () => {
      return ['c1','c2','c3','c4','c5','c6'].map(id => document.getElementById(id).value).join('');
    };

    const verificar = async () => {
      const codigo = getCodigo();
      const errorEl = document.getElementById('ver-error');
      const successEl = document.getElementById('ver-success');
      errorEl.style.display = 'none';

      if (codigo.length !== 6) {
        errorEl.textContent = 'Por favor ingresa el código completo de 6 dígitos';
        errorEl.style.display = 'block';
        return;
      }

      const btn = document.querySelector('.btn-primary');
      btn.textContent = 'Verificando...';
      btn.disabled = true;

      const data = await api.post('/auth/verificar', { email, codigo });

      if (data.ok) {
        auth.save(data.accessToken, data.user);
        successEl.textContent = '¡Cuenta verificada! Redirigiendo...';
        successEl.style.display = 'block';
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } else {
        errorEl.textContent = data.error || 'Código incorrecto';
        errorEl.style.display = 'block';
        btn.textContent = 'Verificar cuenta';
        btn.disabled = false;
      }
    };

    let timerInterval = null;

    const reenviarCodigo = async () => {
      const btn = document.getElementById('btn-reenviar');
      const timerWrap = document.getElementById('timer-wrap');
      const timerEl = document.getElementById('timer');
      btn.disabled = true;
      timerWrap.style.display = 'inline';
      let segundos = 60;
      timerEl.textContent = segundos;
      timerInterval = setInterval(() => {
        segundos--;
        timerEl.textContent = segundos;
        if (segundos <= 0) {
          clearInterval(timerInterval);
          btn.disabled = false;
          timerWrap.style.display = 'none';
        }
      }, 1000);

      const data = await api.post('/auth/reenviar-codigo', { email });
      const successEl = document.getElementById('ver-success');
      if (data.ok) {
        successEl.textContent = '¡Código reenviado! Revisa tu correo.';
        successEl.style.display = 'block';
        setTimeout(() => successEl.style.display = 'none', 3000);
      }
    };
  </script>
<script>window.SOLO_SOPORTE = true;</script>
<script src="../js/chatbot.js"></script>
</body>
</html>
